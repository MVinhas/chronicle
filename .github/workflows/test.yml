name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        # No network and no GUI: these cover date handling, sanitisation and
        # queue ordering, which is where correctness actually lives.
        run: tools/run-tests.sh
