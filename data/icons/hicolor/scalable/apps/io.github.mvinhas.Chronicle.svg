<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset="1" stop-color="#efe6d6"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c14f36"/>
      <stop offset="1" stop-color="#9d3722"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3b2a1c" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- pages stacked behind, so it reads as a collection rather than one page -->
  <rect x="28" y="17" width="82" height="98" rx="12" fill="#cdbfa6"/>
  <rect x="23" y="13" width="88" height="103" rx="13" fill="#e2d5bd"/>

  <!-- the page you are on -->
  <rect x="17" y="9" width="94" height="110" rx="14" fill="url(#paper)"/>
  <rect x="17" y="9" width="94" height="110" rx="14" fill="none"
        stroke="#8d7c62" stroke-opacity="0.32" stroke-width="2"/>

  <!-- a reading list: each entry a source dot and its title -->
  <g>
    <circle cx="35" cy="44" r="4.6" fill="#b3452f"/>
    <rect x="46" y="41.4" width="21" height="5.2" rx="2.6" fill="#2f2822" opacity="0.82"/>

    <circle cx="35" cy="64" r="4.6" fill="#c8823c"/>
    <rect x="46" y="61.4" width="52" height="5.2" rx="2.6" fill="#2f2822" opacity="0.82"/>

    <circle cx="35" cy="84" r="4.6" fill="#5f7f66"/>
    <rect x="46" y="81.4" width="38" height="5.2" rx="2.6" fill="#2f2822" opacity="0.82"/>

    <circle cx="35" cy="104" r="4.6" fill="#40607f" opacity="0.45"/>
    <rect x="46" y="101.4" width="47" height="5.2" rx="2.6" fill="#2f2822" opacity="0.34"/>
  </g>

  <!-- bookmark: where you are up to -->
  <g filter="url(#soft)">
    <path d="M74 9 h20 a0 0 0 0 1 0 0 v42 l-10 -8 -10 8 V9 Z" fill="url(#ribbon)"/>
  </g>
</svg>
