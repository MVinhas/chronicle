<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset="1" stop-color="#f0e8da"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#c9bfae"/>
      <stop offset="0.5"  stop-color="#a89a84"/>
      <stop offset="1"    stop-color="#c9bfae"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#3b2f22" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- page -->
  <rect x="12" y="8" width="104" height="112" rx="18" fill="url(#paper)"/>
  <rect x="12" y="8" width="104" height="112" rx="18" fill="none"
        stroke="#8f8271" stroke-opacity="0.30" stroke-width="2"/>

  <!-- the timeline running through the whole archive -->
  <rect x="35.5" y="24" width="3" height="80" rx="1.5" fill="url(#spine)"/>

  <!-- four sources, oldest at the top, each a different hand -->
  <g filter="url(#lift)">
    <circle cx="37" cy="34" r="7" fill="#b3452f"/>
    <circle cx="37" cy="57" r="7" fill="#c8823c"/>
    <circle cx="37" cy="78" r="7" fill="#5f7f66"/>
    <circle cx="37" cy="97" r="7" fill="#40607f"/>
  </g>
  <circle cx="37" cy="34" r="2.6" fill="#fdfbf6" fill-opacity="0.92"/>
  <circle cx="37" cy="57" r="2.6" fill="#fdfbf6" fill-opacity="0.92"/>
  <circle cx="37" cy="78" r="2.6" fill="#fdfbf6" fill-opacity="0.92"/>
  <circle cx="37" cy="97" r="2.6" fill="#fdfbf6" fill-opacity="0.92"/>

  <!-- the articles themselves -->
  <g fill="#2f2822">
    <rect x="53" y="29"   width="49" height="4.4" rx="2.2" opacity="0.85"/>
    <rect x="53" y="37.5" width="33" height="3.4" rx="1.7" opacity="0.34"/>

    <rect x="53" y="52"   width="43" height="4.4" rx="2.2" opacity="0.85"/>
    <rect x="53" y="60.5" width="38" height="3.4" rx="1.7" opacity="0.34"/>

    <rect x="53" y="73"   width="52" height="4.4" rx="2.2" opacity="0.85"/>
    <rect x="53" y="81.5" width="28" height="3.4" rx="1.7" opacity="0.34"/>

    <rect x="53" y="92"   width="39" height="4.4" rx="2.2" opacity="0.85"/>
    <rect x="53" y="100.5" width="45" height="3.4" rx="1.7" opacity="0.34"/>
  </g>
</svg>
